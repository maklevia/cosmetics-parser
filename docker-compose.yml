services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker-files/Dockerfile.api
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-3001}
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker-files/Dockerfile.frontend
      args:
        API_ORIGIN: ${API_ORIGIN:-http://localhost:3001}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: docker-files/Dockerfile.bot
    env_file:
      - .env
    environment:
      API_ORIGIN: http://api:${API_PORT:-3001}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
